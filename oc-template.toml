schema = 1

[template]
name = "ShipVideo"
description = "Paste a URL or a prompt, get a 30-second launch video. Opus 5.5 writes the film as HTML; the agent renders it frame by frame in headless Chromium and ffmpeg. No video model."
documentation = "https://github.com/diggerhq/shipvideo#readme"
default_project_name = "shipvideo"

[template.first_run]
agent = "director"
prompt = "Make a 25-second launch video for a fictional startup that does LLM inference. Save the MP4 to the session workspace and report its path."
